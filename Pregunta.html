<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg, #0f172a, #1e293b, #334155);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.contenedor{
    width:90%;
    max-width:700px;
    background:#64748b;
    padding:40px;
    border-radius:25px;
    box-shadow:0px 0px 25px rgba(0,0,0,0.4);
}

.barra-fondo{
    width:100%;
    height:25px;
    background:#cbd5e1;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:35px;
}

.barra{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    transition:0.5s;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.pregunta{
    font-size:1.5rem;
    margin-bottom:30px;
    text-align:center;
}

.respuestas{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.respuesta{
    padding:15px;
    border:none;
    border-radius:15px;
    background:#e2e8f0;
    cursor:pointer;
    font-size:1rem;
    transition:0.3s;
}

.respuesta:hover{
    background:#38bdf8;
    transform:scale(1.03);
}

.seleccionado{
    background:#22c55e;
    color:white;
    transform:scale(1.03);
    box-shadow:0px 0px 15px rgba(34,197,94,0.6);
}

.boton-avanzar{
    margin-top:30px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#22c55e;
    color:white;
    font-size:1.1rem;
    cursor:pointer;
    transition:0.3s;
}

.boton-avanzar:hover{
    background:#16a34a;
}

.resultado{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background:rgba(15,23,42,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:30px;
    z-index:1000;
}

.resultado img{
    width:250px;
    margin-bottom:20px;
    border-radius:20px;
}

.resultado h2{
    font-size:3rem;
    margin-bottom:20px;
    color:#38bdf8;
}

.resultado p{
    max-width:600px;
    margin-bottom:30px;
    font-size:1.2rem;

.botonesCompartir button{
    padding:15px 30px;
    border:none;
    border-radius:15px;
    background:#22c55e;
    color:white;
    font-size:1rem;
    cursor:pointer;

// MOSTRAR PRIMERA PREGUNTA
cargarPregunta();

function cargarPregunta(){

    document.getElementById("pregunta").innerText =
    preguntas[preguntaActual].pregunta;

    let contenedor = document.getElementById("respuestas");

    contenedor.innerHTML = "";

    preguntas[preguntaActual].respuestas.forEach(respuesta => {

        contenedor.innerHTML += `

        <button
        class="respuesta"
        onclick="seleccionar('${respuesta.valor}', event)">

        ${respuesta.texto}

        </button>

        `;

    });

}

// SELECCIONAR
function seleccionar(valor, event){

    respuestaSeleccionada = valor;

    let botones = document.querySelectorAll(".respuesta");

    botones.forEach(boton => {
        boton.classList.remove("seleccionado");
    });

    event.target.classList.add("seleccionado");

}

// AVANZAR
function avanzarPregunta(){

    if(respuestaSeleccionada == ""){

        alert("Selecciona una respuesta 😾");

        return;
    }

    puntos[respuestaSeleccionada]++;

    preguntaActual++;

    let progreso =
    (preguntaActual / preguntas.length) * 100;

    document.getElementById("barra").style.width =
    progreso + "%";

    respuestaSeleccionada = "";

    if(preguntaActual >= preguntas.length){

        mostrarResultado();

        return;
    }

    cargarPregunta();

}

// GANADOR
function obtenerGanador(){

    let mayor = 0;
    let ganador = "";

    for(let grupo in puntos){

        if(puntos[grupo] > mayor){

            mayor = puntos[grupo];
            ganador = grupo;

        }

    }

    return ganador;

}

// RESULTADO

// COMPARTIR

    "Descubre qué grupo funcional eres 😎";

    // COMPARTIR EN TELEFONO
    if(navigator.share){

        navigator.share({

            title:"¿Qué grupo funcional eres?",
            text:texto,
            url:window.location.href

        });

    }

    // SI NO FUNCIONA

        alert("Tu navegador no soporta compartir 😿");
